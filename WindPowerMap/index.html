<!DOCTYPE html>
<html>
<head>
    <title>Offshore Wind Estimator</title>
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        #map { height: 400px; width: 100%; margin-bottom: 20px; border-radius: 8px; background-color: #f0f0f0; }
        body { padding: 20px; background-color: #f8f9fa; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4">Offshore Wind Power Estimator</h2>
        <div id="map"></div>

        <div class="row g-3">
            <div class="col-md-3"><label>Latitude</label><input type="number" id="lat" class="form-control" step="0.0001"></div>
            <div class="col-md-3"><label>Longitude</label><input type="number" id="lon" class="form-control" step="0.0001"></div>
            <div class="col-md-3"><label>Start Date</label><input type="text" id="startDate" class="form-control" value="20250101"></div>
            <div class="col-md-3"><label>End Date</label><input type="text" id="endDate" class="form-control" value="20250101"></div>
            <div class="col-md-3"><label>Nominal Power (MW)</label><input type="number" id="nominalPower" class="form-control" value="8"></div>
            <div class="col-md-3"><label>Number of Turbines</label><input type="number" id="numTurbines" class="form-control" value="50"></div>
            <div class="col-md-3">
                <label>Cut-in Speed [m/s]</label>
                <input type="number" id="cutIn" class="form-control" value="3" step="0.5">
            </div>
            <div class="col-md-3">
                <label>Cut-out Speed [m/s]</label>
                <input type="number" id="cutOut" class="form-control" value="25" step="1">
            </div>

            <div id="resultsSummary" class="mt-5" style="display:none;">
                <h3>Average Daily Output Summary</h3>
                <div class="table-responsive">
                    <table class="table table-striped table-bordered mt-2">
                        <thead class="table-dark">
                            <tr>
                                <th>Date</th>
                                <th>Avg Wind Speed [m/s]</th>
                                <th>Daily Total (All Turbines) [MWh]</th>
                                <th>Avg Hourly Output [MW]</th>
                            </tr>
                        </thead>
                        <tbody id="summaryBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="col-12 mt-4">
                <button onclick="calculatePower()" class="btn btn-primary btn-lg">Calculate & Download CSV</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>

    <script>
        (function() {
            console.log("Checking for CONFIG...");
            if (typeof CONFIG !== 'undefined' && CONFIG.GOOGLE_MAPS_API_KEY) {
                console.log("Key found! Loading Google Maps...");
                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${CONFIG.GOOGLE_MAPS_API_KEY}&callback=initMap`;
                script.async = true;
                script.defer = true;
                document.head.appendChild(script);
            } else {
                console.error("CRITICAL: CONFIG is missing or key is empty. Check config.js file.");
            }
        })();
    </script>
</body>
</html>
